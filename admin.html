<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Панель адміністратора — IT Support</title>
</head>
<body>
<header class="topbar">
  <strong class="brand">IT Support</strong><span class="crumb">Панель адміністратора</span>
  <span><span id="user-name"></span> <button class="btn light" data-logout>Вийти</button></span>
</header>
<main class="container">
  <p id="msg" hidden></p>
  <section class="stats">
    <div class="card stat"><b id="st-new">0</b>Нових</div>
    <div class="card stat"><b id="st-active">0</b>Активних</div>
    <div class="card stat"><b id="st-done">0</b>Завершених</div>
  </section>
  <section class="card row">
    <label>Пошук (№, автор, назва)<input id="search" type="search"></label>
    <label>Статус
      <select id="f-status">
        <option value="">Усі</option><option value="new">Нова</option><option value="in_progress">У роботі</option>
        <option value="waiting">Очікування</option><option value="completed">Завершена</option><option value="rejected">Відхилена</option>
      </select>
    </label>
    <label>Пріоритет
      <select id="f-priority">
        <option value="">Усі</option><option value="low">Низький</option><option value="medium">Середній</option>
        <option value="high">Високий</option><option value="critical">Критичний</option>
      </select>
    </label>
    <label>Дата створення<input id="f-date" type="date"></label>
  </section>
  <div id="loader" class="loader" hidden></div>
  <section class="card table-wrap">
    <table>
      <thead><tr><th>№</th><th>Дата</th><th>Заявник</th><th>Обладнання</th><th>Проблема</th><th>Статус</th><th>Пріоритет</th><th>Термін</th></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </section>
  <section id="detail" class="card" hidden>
    <h2 id="d-title"></h2>
    <div id="d-info"></div>
    <form id="detail-form">
      <div class="row">
        <label>Статус
          <select id="d-status">
            <option value="new">Нова</option><option value="in_progress">У роботі</option><option value="waiting">Очікування</option>
            <option value="completed">Завершена</option><option value="rejected">Відхилена</option>
          </select>
        </label>
        <label>Пріоритет
          <select id="d-priority">
            <option value="low">Низький</option><option value="medium">Середній</option>
            <option value="high">Високий</option><option value="critical">Критичний</option>
          </select>
        </label>
        <label>Термін виконання<input id="d-due" type="date"></label>
      </div>
      <label>Коментар (причина несправності, діагностика)<textarea id="d-comment"></textarea></label>
      <label>Виконані роботи (спосіб усунення)<textarea id="d-resolution"></textarea></label>
      <button class="btn" type="submit">Зберегти</button>
      <button class="btn light" type="button" id="d-close">Закрити</button>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/requests.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
