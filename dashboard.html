<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Особистий кабінет — IT Support</title>
</head>
<body>
<header class="topbar">
  <strong class="brand">IT Support</strong><span class="crumb"></span>
  <span><a href="create-request.html">+ Нова заявка</a> <span id="user-name"></span> <button class="btn light" data-logout>Вийти</button></span>
</header>
<main class="container">
  <p id="msg" hidden></p>
  <section class="card">
    <h2>Мій профіль</h2>
    <form id="profile-form" class="row">
      <label>Ім’я та прізвище<input id="p-name" type="text"></label>
      <label>Телефон<input id="p-phone" type="tel"></label>
      <div><button class="btn" type="submit">Зберегти</button></div>
    </form>
  </section>
  <section>
    <div class="toolbar"><h2>Мої заявки</h2><a class="btn" href="create-request.html">Створити заявку</a></div>
    <div class="card row">
      <label>Пошук за назвою<input id="search" type="search" placeholder="Назва заявки"></label>
      <label>Статус
        <select id="f-status">
          <option value="">Усі</option><option value="new">Нова</option><option value="in_progress">У роботі</option>
          <option value="waiting">Очікування</option><option value="completed">Завершена</option><option value="rejected">Відхилена</option>
        </select>
      </label>
    </div>
    <div id="loader" class="loader" hidden></div>
    <div id="list"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/requests.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
